# Per-install values. Keys here are THIS install's own facts, pinned
# explicitly: the app chart's defaults belong to whichever install it was
# authored against, and an omitted key inherits them silently.
# Sign-in goes through this install's playbook-studio realm (granted in teams/playbook-studio).
playbook-studio:
  host: playbook-studio.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/playbook-studio
      clientId: playbook-studio
      existingSecret: keycloak-playbook-studio
  images:
    app:
      repository: ghcr.io/foundryrb/playbook-studio-app
      tag: 1.0.0
    docs:
      repository: ghcr.io/foundryrb/playbook-studio-docs
      tag: 1.0.0
